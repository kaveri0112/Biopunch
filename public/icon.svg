<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle tech grid/rings in background -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#312e81" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#4338ca" stroke-width="2" opacity="0.3" />
  
  <!-- Outer glowing pulse ring -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6" filter="url(#glow)" />
  
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="120" fill="#18182f" stroke="url(#primaryGrad)" stroke-width="6" />

  <!-- Biometric Fingerprint Motif -->
  <g fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round">
    <!-- Center loop -->
    <path d="M256,220 C246,220 238,230 238,242 C238,260 256,275 256,290 C256,298 250,305 244,305" />
    <path d="M256,200 C234,200 220,216 220,238 C220,268 238,284 238,300 C238,318 226,326 216,326" />
    <path d="M272,216 C272,210 266,204 256,204" />
    <path d="M272,236 C272,260 260,272 260,296 C260,314 274,324 286,324" />
    <!-- Outer ridges -->
    <path d="M202,230 C202,198 226,178 256,178 C286,178 310,198 310,230 C310,264 288,284 288,312" />
    <path d="M184,244 C184,200 216,160 256,160 C296,160 328,200 328,244 C328,280 306,306 306,336" />
    <path d="M170,270 C170,210 208,144 256,144 C304,144 342,210 342,270" stroke-opacity="0.6" />
  </g>

  <!-- Punch Verification Checkmark & Clock Badge at Bottom-Right -->
  <g transform="translate(320, 320)">
    <circle cx="40" cy="40" r="44" fill="#0f172a" stroke="#10b981" stroke-width="5" />
    <circle cx="40" cy="40" r="36" fill="#10b981" />
    <path d="M26,40 L36,50 L56,28" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Vibration / Pulse Waves -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M130,190 C110,225 110,285 130,320" />
    <path d="M105,175 C80,220 80,290 105,335" stroke-width="3" opacity="0.5" />
    <path d="M382,190 C402,225 402,285 382,320" />
    <path d="M407,175 C432,220 432,290 407,335" stroke-width="3" opacity="0.5" />
  </g>
</svg>
